# pyproject.toml -- vault-kg package configuration (PEP 621)
#
# Obsidian-style Markdown vaults as fleet knowledge graphs.
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md in
# kgrag_priv.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  graph build + analyze + MCP (no embedding stack)
#   pip install -e ".[semantic]"        + embedding model, for query / pack
#   pip install -e ".[viz]"             + 2-D link graph (vaultkg viz)
#   pip install -e ".[viz3d]"           + 3-D folder tree, quilts, viewer
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install --with docs          + mkdocs, to build the docs site
#   poetry install --with dev,docs --all-extras   full maintainer environment
#
# dockg and pycodekg index this repo but nothing under src/ imports them, so
# they are global tools, not dependencies ("Tools are global", FLEET_STANDARDS).
#
# Run tests
# ---------
#   pytest
#
# Build a vault graph
# -------------------
#   vaultkg build --vault ~/brain
#   vaultkg-mcp --vault ~/brain         serve it to an agent

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "vaultkg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "vault-kg"
version = "0.1.0"
description = "Obsidian-style Markdown vaults as KGModule knowledge graphs: wikilinks, typed links, tags and headings, no LLM extraction"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "kgmodule", "obsidian", "markdown", "wikilinks", "sqlite-vec", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # 0.23.0: KGModule.query()/pack() validate their arguments (k, hop,
    # max_nodes, query length), so neither the CLI nor the MCP server repeats
    # the check; and KGModule.__enter__ returns Self, so `with VaultKG(...)`
    # keeps the subclass type under ty.
    "kgmodule-utils>=0.23.0",
    # Capped: mcp 2.0 removed the bundled `mcp.server.fastmcp` module (it
    # became the standalone fastmcp package). mcp_server.py imports FastMCP
    # from mcp at module scope, so an unbounded floor would let a clean install
    # break `vaultkg-mcp` at import time. Lift only alongside a port. Floor
    # 1.3.0: the first FastMCP that takes the lifespan= and instructions=
    # mcp_server.py passes.
    "mcp>=1.3.0,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The embedding model and the sqlite-vec index, for `vaultkg query` / `pack`
# and the query_vault / pack_vault MCP tools. Without it everything else
# works; build with --no-index.
semantic = ["kgmodule-utils[semantic]>=0.23.0"]
# 2-D link graph (vaultkg viz): src/vaultkg/viz.py, imported only inside the
# command. pyvis is not hand-listed: the renderer is kg_utils.viz.build_graph_html,
# so this extra asks the SDK for it by name, as FLEET_STANDARDS.md requires.
viz = ["kgmodule-utils[viz]>=0.23.0"]
# 3-D folder tree and Looking Glass quilts (vaultkg quilt / vaultkg viz3d):
# src/vaultkg/scene.py and viz3d.py. The render stack comes through
# kgmodule-utils[viz3d-render,viz3d-qt] rather than hand-listed pyvista/PyQt5.
# pyvistaqt IS hand-listed: viz3d-qt pulls PyQt5 and pyvista but not
# pyvistaqt, which the viewer's QtInteractor needs (connectome_kg and
# genealogy_kg carry the same line for the same reason).
viz3d = [
    "kgmodule-utils[viz3d-render,viz3d-qt]>=0.23.0",
    "pyvistaqt>=0.11.0",
    "quiltwright>=0.15.0",
]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/vault_kg"
Repository = "https://github.com/Flux-Frontiers/vault_kg"
Issues     = "https://github.com/Flux-Frontiers/vault_kg/issues"
Changelog  = "https://github.com/Flux-Frontiers/vault_kg/blob/main/CHANGELOG.md"
Documentation = "https://flux-frontiers.github.io/vault_kg/"

[project.scripts]
vaultkg     = "vaultkg.cli:cli"
vaultkg-mcp = "vaultkg.mcp_server:main"

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the rest of the fleet and the rev pinned in
# .pre-commit-config.yaml.
ruff = ">=0.15,<0.16"
ty = ">=0.0.44"
# The stub-embedder tests build a real sqlite-vec index without the semantic
# extra's torch stack. Exact pin, matching kgmodule-utils' own.
sqlite-vec = "0.1.9"
numpy = ">=1.26.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# mkdocs is capped below 2: 2.0 removes the plugin system, and this site
# depends on two plugins (search, mkdocstrings).
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# Keep prose docs out of ruff 0.16's Markdown code-block formatting.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B023", "BLE001", "PLC0415"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["vaultkg"]

[tool.coverage.report]
# A floor against regression, not a target. Checked by `pytest --cov` in CI
# and in the pre-commit pytest hook; raise it as coverage grows.
fail_under = 90

# ---------------------------------------------------------------------------
# KG index configuration (dockg / pycodekg are global tools; see above)
# ---------------------------------------------------------------------------
[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = ["__pycache__", "dist", "src", "tests"]
