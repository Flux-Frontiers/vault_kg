# Build the docs/*.md guides and the mkdocstrings API reference into a
# GitHub Pages site. Same shape as connectome_kg's and quiltwright's docs
# workflows, plus a build on pull requests: `mkdocs build --strict` fails on a
# broken link or a page missing from the nav, and that belongs before the
# merge, not after it. Only a push to main deploys.
#
# Pages must be enabled with "GitHub Actions" as the source (Settings ->
# Pages), or the deploy job fails.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/vaultkg/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/vaultkg/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: docs-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # mkdocstrings reads the source statically and never imports it, so the
      # API pages for scene.py and viz.py need no render extra installed.
      - name: Install dependencies
        run: poetry install --no-interaction --with docs

      - name: Build
        run: poetry run mkdocs build --strict

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
