name: Release

# Builds the wheel and sdist, attaches them to a GitHub Release, and
# publishes the same two files to PyPI.
#
# The PyPI upload uses trusted publishing (OIDC), so there is no API token in
# the repository secrets. It is configured on PyPI under the project's
# Publishing settings (a pending publisher until the first upload) and must
# name this repository, the workflow file `release.yml`, and the `pypi`
# environment below; change any of those three and the upload stops.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --only main --no-interaction

      # The tag must match the version being built; a mismatch would publish
      # one version's files under another's tag.
      - name: Check the tag matches pyproject.toml
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$(poetry version -s)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match pyproject version $VERSION"; exit 1
          fi
          head -1 release-notes.md | grep -qF "v$VERSION" \
            || { echo "release-notes.md does not name v$VERSION"; exit 1; }

      - name: Build wheel and sdist
        run: poetry build

      # Hand the built files to the publish job rather than letting it rebuild,
      # so PyPI and the GitHub Release carry byte-identical artifacts.
      - name: Stash dist for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Publishing the GitHub Release is what makes Zenodo archive this version
      # and mint its DOI; a bare tag push does not.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists -- uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "VaultKG $TAG" \
              --notes-file release-notes.md
          fi

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vault-kg
    # Replaces the workflow-level `contents: write` for this job: publishing
    # needs to mint an OIDC token and nothing else.
    permissions:
      id-token: write
    steps:
      - name: Fetch the artifacts the release job built
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
