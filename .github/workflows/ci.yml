name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dev dependencies
        run: poetry install --no-interaction --with dev

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: typecheck-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # The viz and viz3d extras, so ty checks the render code against the
      # same pyvista, PyQt5 and quiltwright types a developer's environment
      # has; without them those imports are unresolved and the suppressions
      # the render code needs are reported as unused. No semantic extra:
      # nothing under src/ imports the embedding stack directly.
      - name: Install dependencies
        run: poetry install --no-interaction --with dev --extras "viz viz3d"

      - name: Run ty
        run: poetry run ty check src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      # VTK needs an OpenGL context: this starts Xvfb with Mesa and exports
      # DISPLAY (and PYVISTA_OFF_SCREEN) for the steps that follow.
      - name: Set up a headless display
        uses: pyvista/setup-headless-display-action@v4

      # Libraries PyQt5's QtWidgets links against, for the viewer tests.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      # The viz and viz3d extras, so the render tests run rather than skip.
      # No semantic extra: the suite embeds with a hashing stub
      # (tests/conftest.py) into a real sqlite-vec index, which the dev group
      # installs, so query and pack run without a model download. A core-only
      # install is proven by the Installed CLI job below.
      - name: Install dependencies
        run: poetry install --no-interaction --with dev --extras "viz viz3d"

      # importorskip turns a missing package into a skip; here that would be
      # a silent pass, so check every package the gated tests need first.
      - name: Check the extras import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          poetry run python -c "import pyvis, pyvista, pyvistaqt, PyQt5.QtWidgets, quiltwright; print('viz and viz3d extras import')"

      # --cov activates the fail_under gate in [tool.coverage.report]; it is
      # not repeated here, so there is one number to keep in sync. Any skip
      # fails the job: with the extras installed, a skip means a test that
      # did not run.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail  # the default bash -e would let tee hide a pytest failure
          poetry run pytest -rs --cov --cov-report=term-missing | tee /tmp/tests.out
          if grep -q "SKIPPED" /tmp/tests.out; then
            echo "a test skipped although the extras are installed"; exit 1
          fi

  wheel:
    name: Installed CLI
    runs-on: ubuntu-latest
    # Guards what the other jobs cannot see: they run against the source tree,
    # so they pass even when the built wheel is missing modules the CLI imports
    # or declares a dependency in a form PyPI strips from wheel metadata.
    #
    # This builds the artifact users actually receive, installs it core-only
    # somewhere with no source tree in sight, and puts it through three gates:
    #
    #   1. every console-script entry point loads. entry_point.load() imports
    #      the module and resolves the attribute without calling it, so the MCP
    #      server entry point is verified, not started.
    #   2. a small vault builds and answers analyze, stats and links. Gate 1
    #      proves the code imports; only this proves it runs. --no-index keeps
    #      it free of the semantic extra and any model download.
    #   3. every packaged submodule imports.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build wheel
        run: poetry build

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl

      - name: Load every console-script entry point
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import sys

          eps = [e for e in md.distribution("vault-kg").entry_points
                 if e.group == "console_scripts"]
          if not eps:
              sys.exit("no console scripts found in the installed distribution")

          failed = []
          for e in sorted(eps, key=lambda e: e.name):
              try:
                  e.load()
                  print(f"  ok    {e.name} -> {e.value}")
              except Exception as exc:
                  failed.append(e.name)
                  print(f"  FAIL  {e.name} -> {e.value}\n        {type(exc).__name__}: {exc}")
          if failed:
              sys.exit(f"\n{len(failed)} console script(s) unusable when installed: "
                       + ", ".join(failed))
          print(f"\nall {len(eps)} console scripts load from a clean install")
          PY

      - name: Build a small vault and query it end to end
        run: |
          mkdir -p /tmp/vault/notes
          printf '# Home\n\nStart at [[Ideas]]. #index\n' > /tmp/vault/Home.md
          printf -- '---\ncreated: 2026-09-01\n---\n# Ideas\n\nsupports:: [[Home]]\n' \
            > /tmp/vault/notes/Ideas.md
          cd /tmp
          /tmp/smoke/bin/vaultkg build --vault /tmp/vault --no-index
          test -f /tmp/vault/.vaultkg/graph.sqlite || { echo "no graph.sqlite"; exit 1; }
          /tmp/smoke/bin/vaultkg stats --vault /tmp/vault | tee /tmp/stats.out
          grep -q '"notes": 2' /tmp/stats.out || { echo "expected 2 notes"; exit 1; }
          /tmp/smoke/bin/vaultkg links --vault /tmp/vault --in Home | tee /tmp/links.out
          grep -q "SUPPORTS" /tmp/links.out || { echo "typed backlink missing"; exit 1; }
          /tmp/smoke/bin/vaultkg analyze --vault /tmp/vault | head -3
          # The render commands must say which extra to install, not crash.
          for cmd in viz quilt viz3d; do
            /tmp/smoke/bin/vaultkg $cmd --vault /tmp/vault 2>&1 | tee /tmp/$cmd.out || true
            grep -q 'pip install "vault-kg\[' /tmp/$cmd.out \
              || { echo "$cmd did not name its extra"; exit 1; }
          done
          echo "end-to-end build + stats + links OK"

      - name: Import every packaged submodule
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib
          import pkgutil
          import sys

          import vaultkg

          names = [m.name for m in pkgutil.walk_packages(vaultkg.__path__, "vaultkg.")]
          if not names:
              sys.exit("vaultkg has no submodules -- the wheel is missing its package body")

          # Modules that import their extra at module scope, and the extra.
          # Everything else must import core-only.
          extra_only = {"vaultkg.scene": "viz3d", "vaultkg.viz3d": "viz3d"}

          failed = []
          for name in sorted(names):
              try:
                  importlib.import_module(name)
              except ModuleNotFoundError as exc:
                  if name in extra_only and not (exc.name or "").startswith("vaultkg"):
                      print(f"  skip  {name} (needs the {extra_only[name]} extra: {exc.name})")
                      continue
                  failed.append(name)
                  print(f"  FAIL  {name}\n        {type(exc).__name__}: {exc}")
              except Exception as exc:
                  failed.append(name)
                  print(f"  FAIL  {name}\n        {type(exc).__name__}: {exc}")
          if failed:
              sys.exit(f"\n{len(failed)} of {len(names)} submodule(s) fail to import "
                       "from the installed wheel: " + ", ".join(failed))
          print(f"all {len(names)} packaged submodules import from a clean install")
          PY
