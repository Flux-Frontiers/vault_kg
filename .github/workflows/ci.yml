name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # No embedding model: the tests use a hashing stub embedder, so only the
      # sqlite-vec store is needed, not torch.
      - name: Install
        run: pip install -e . "kgmodule-utils[sqlite-vec]>=0.23.0" numpy pytest "ruff>=0.15,<0.16"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
